[package]
name = "irc_proto"
version = "0.1.0"
edition = "2021"

[dependencies]
log = {version = "0.4"}
env_logger = {version = "0.11"}
tokio = { version = "1.53", features = ["full"], optional = true }
tokio-stream = { version = "0.1", optional = true }

[[example]]
name = "message"

[features]
default = ["async-transport"]
async-transport = ["dep:tokio"]
async-connection-stream = ["dep:tokio-stream"]
sync-transport = []
